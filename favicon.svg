<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="#c0392b"/>
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="none" stroke="white" stroke-width="6"/>

  <!-- K arms drawn first; V3 stem (last) covers their near ends -->
  <polygon fill="white" points="60,50.3 71.8,28.8 76.2,31.2 60,60.7"/>
  <polygon fill="white" points="60,39.4 76.2,68.8 71.8,71.2 60,49.8"/>

  <!-- M diagonals: outside-stem top corner clipped to inner stem edge at y=30
       so the stem rect drawn on top gives a clean flat top with no pointy artifact -->
  <polygon fill="white" points="31,30 38.9,53.4 34.1,54.6 28.6,30.6"/>
  <polygon fill="white" points="34.1,53.4 42,30 44.4,30.6 38.9,54.6"/>
  <polygon fill="white" points="47,30 54.9,53.4 50.1,54.6 44.6,30.6"/>
  <polygon fill="white" points="50.1,53.4 58,30 60.4,30.6 54.9,54.6"/>

  <!-- Stems drawn last — their y=30 top edge is the only visible top -->
  <rect x="26" y="30" width="5" height="40" fill="white"/>
  <rect x="42" y="30" width="5" height="40" fill="white"/>
  <rect x="58" y="30" width="5" height="40" fill="white"/>
</svg>
