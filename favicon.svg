<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red hexagon -->
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="#c0392b"/>
  <!-- White border -->
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="none" stroke="white" stroke-width="5"/>

  <!-- Each M is ONE polygon with a built-in V-notch — zero joint artifacts -->

  <!-- M1: left stem (x25-28), notch valley at (33.5,53), right stem (x39-42) -->
  <polygon points="25,30 28,30 33.5,53 39,30 42,30 42,70 25,70" fill="white"/>

  <!-- M2: shares V2 stem with M1, notch valley at (49,53), right stem (x56-59) -->
  <polygon points="39,30 42,30 49,53 56,30 59,30 59,70 39,70" fill="white"/>

  <!-- K: two triangular arms from V3 right-midpoint — no right stem -->
  <polygon points="59,50 72.4,28.8 75.6,31.2" fill="white"/>
  <polygon points="59,50 75.6,68.8 72.4,71.2" fill="white"/>
</svg>
