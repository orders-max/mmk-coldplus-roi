<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red hexagon (flat-top) -->
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="#c0392b"/>
  <!-- White border -->
  <polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="none" stroke="white" stroke-width="4.5"/>

  <!-- MMK monogram — 3 shared vertical stems, no right stem on K -->
  <rect x="13"   y="20" width="8" height="60" fill="white"/>
  <rect x="37.7" y="20" width="8" height="60" fill="white"/>
  <rect x="62.3" y="20" width="8" height="60" fill="white"/>

  <!-- M1 left diagonal (V1 top-right → valley) -->
  <polygon points="24.9,18.9 33.2,48.9 25.5,51.1 17.2,21.1" fill="white"/>
  <!-- M1 right diagonal (valley → V2 top-left) -->
  <polygon points="33.8,18.9 41.5,21.1 33.2,51.1 25.5,48.9" fill="white"/>

  <!-- M2 left diagonal (V2 top-right → valley) -->
  <polygon points="49.5,18.9 57.9,48.9 50.2,51.1 41.8,21.1" fill="white"/>
  <!-- M2 right diagonal (valley → V3 top-left) -->
  <polygon points="58.5,18.9 66.2,21.1 57.9,51.1 50.1,48.9" fill="white"/>

  <!-- K upper diagonal (V3 mid-right → upper-right, no right stem) -->
  <polygon points="66.5,49.0 73.1,24.0 80.9,26.0 74.2,51.0" fill="white"/>
  <!-- K lower diagonal (V3 mid-right → lower-right, no right stem) -->
  <polygon points="74.2,49.0 80.9,74.0 73.1,76.0 66.5,51.0" fill="white"/>
</svg>
